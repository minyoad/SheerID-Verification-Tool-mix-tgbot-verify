services:
  tgbot:
    build: .
    container_name: sheerid-tgbot
    restart: unless-stopped

    # 环境变量
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # Telegram Bot 配置
      - BOT_TOKEN=${BOT_TOKEN}
      - CHANNEL_USERNAME=${CHANNEL_USERNAME:-pk_oa}
      - CHANNEL_URL=${CHANNEL_URL:-https://t.me/pk_oa}
      - ADMIN_USER_ID=${ADMIN_USER_ID}
      # 数据库配置（默认 SQLite，无需额外服务）
      - DB_TYPE=${DB_TYPE:-sqlite}
      - SQLITE_PATH=${SQLITE_PATH:-/app/data/bot.db}
      # 如需 MySQL，将 DB_TYPE 设为 mysql 并取消下方注释（同时启用底部 mysql 服务）
      # - MYSQL_HOST=${MYSQL_HOST:-mysql}
      # - MYSQL_PORT=${MYSQL_PORT:-3306}
      # - MYSQL_USER=${MYSQL_USER:-tgbot_user}
      # - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      # - MYSQL_DATABASE=${MYSQL_DATABASE:-tgbot_verify}

    # 扩大共享内存（Chromium 渲染必需，避免 /dev/shm 过小导致卡死）
    shm_size: "1gb"

    # 数据持久化（统一挂载到 /docker/sheerid）
    volumes:
      # SQLite 数据库文件（DB_TYPE=sqlite 时使用）
      - ${DATA_DIR:-/docker/sheerid}/data:/app/data
      # 日志
      - ${DATA_DIR:-/docker/sheerid}/logs:/app/logs

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tgbot-net

# ==================== 可选：MySQL 模式 ====================
# 如需使用 MySQL 替代 SQLite：
#   1. 在 .env 中将 DB_TYPE 设为 mysql
#   2. 取消下方 mysql 服务注释
#   3. 取消 tgbot 服务中 MYSQL_* 环境变量的注释
#   4. 首次部署需创建目录并授权：
#      mkdir -p /docker/sheerid/mysql_data && chown -R 999:999 /docker/sheerid/mysql_data
