services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: sheerid-mysql
    restart: unless-stopped

    # 环境变量
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_USER=${MYSQL_USER:-tgbot_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-tgbot_verify}

    # 使用 utf8mb4 字符集，支持 emoji
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    # 数据持久化（统一挂载到 /docker/sheerid）
    volumes:
      - ${DATA_DIR:-/docker/sheerid}/mysql_data:/var/lib/mysql

    # 端口映射（可选：如需从宿主机访问数据库，取消注释；注意避免与本机已装的 MySQL 冲突）
    # ports:
    #   - "3306:3306"

    # 健康检查
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - tgbot-net

  tgbot:
    build: .
    container_name: sheerid-tgbot
    restart: unless-stopped

    # 环境变量
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # Telegram Bot 配置
      - BOT_TOKEN=${BOT_TOKEN}
      - CHANNEL_USERNAME=${CHANNEL_USERNAME:-pk_oa}
      - CHANNEL_URL=${CHANNEL_URL:-https://t.me/pk_oa}
      - ADMIN_USER_ID=${ADMIN_USER_ID}
      # MySQL配置（默认连接 compose 内的 mysql 服务）
      - MYSQL_HOST=${MYSQL_HOST:-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-tgbot_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-tgbot_verify}

    # 等待 MySQL 就绪后再启动
    depends_on:
      mysql:
        condition: service_healthy

    # 扩大共享内存（Chromium 渲染必需，避免 /dev/shm 过小导致卡死）
    shm_size: "1gb"

    # 日志持久化（统一挂载到 /docker/sheerid）
    volumes:
      - ${DATA_DIR:-/docker/sheerid}/logs:/app/logs

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 网络
    networks:
      - tgbot-net

networks:
  tgbot-net:
    driver: bridge
