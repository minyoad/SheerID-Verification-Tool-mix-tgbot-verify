services:
  tgbot:
    build: .
    container_name: sheerid-tgbot
    restart: unless-stopped

    # 环境变量
    # 机器人配置（BOT_TOKEN、DB_*、CAPTCHA_*、2CAPTCHA_API_KEY 等）不再通过
    # compose 插值转发，而是由代码直接读取挂载卷 /app/data/.env
    # （宿主机对应 ${DATA_DIR:-/docker/sheerid}/data/.env，见下方 volumes）。
    # 修改配置只需编辑宿主机该文件后重启容器；2CAPTCHA_API_KEY 等数字开头
    # 变量名也可直接写入文件，无 compose 插值限制。
    # 此处仅保留容器运行所需参数。
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # 有头模式（CAPTCHA_HEADLESS=false）所需的虚拟显示；无头模式不受影响
      - DISPLAY=:99
      # 如需 MySQL：在 /app/data/.env 中设置 DB_TYPE=mysql 及 MYSQL_* 配置，
      # 并取消底部注释的 mysql 服务。

    # 启动 Xvfb 虚拟显示（供 CAPTCHA_HEADLESS=false 有头浏览器使用），再运行 bot。
    # 无头模式（默认 CAPTCHA_HEADLESS=true）不需要 X 显示，本配置不产生副作用。
    command: bash -c "Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset & sleep 1; exec python -u bot.py"

    # 扩大共享内存（Chromium 渲染必需，避免 /dev/shm 过小导致卡死）
    shm_size: "1gb"

    # 数据持久化（统一挂载到 /docker/sheerid）
    volumes:
      # SQLite 数据库文件（DB_TYPE=sqlite 时使用）及 .env 配置（挂载进 /app/data/.env）
      - ${DATA_DIR:-/docker/sheerid}/data:/app/data
      # 日志
      - ${DATA_DIR:-/docker/sheerid}/logs:/app/logs

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - tgbot-net

# ==================== 可选：MySQL 模式 ====================
# 如需使用 MySQL 替代 SQLite：
#   1. 在数据目录 .env（/docker/sheerid/data/.env）中设置 DB_TYPE=mysql 及 MYSQL_* 配置
#   2. 取消下方 mysql 服务注释（该服务通过 env_file 直接读取同一份 .env，不经插值解析）
#   3. 首次部署需创建目录并授权：
#      mkdir -p /docker/sheerid/mysql_data && chown -R 999:999 /docker/sheerid/mysql_data
#
# mysql:
#   image: mysql:8.0
#   container_name: sheerid-mysql
#   restart: unless-stopped
#   environment:
#     - TZ=Asia/Shanghai
#   env_file:
#     - ${DATA_DIR:-/docker/sheerid}/data/.env
#   command:
#     - --character-set-server=utf8mb4
#     - --collation-server=utf8mb4_unicode_ci
#   volumes:
#     - ${DATA_DIR:-/docker/sheerid}/mysql_data:/var/lib/mysql
#   healthcheck:
#     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
#     interval: 10s
#     timeout: 5s
#     retries: 5
#     start_period: 30s
#   networks:
#     - tgbot-net

networks:
  tgbot-net:
    driver: bridge
